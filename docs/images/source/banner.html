<!doctype html>
<html><head><meta charset="utf-8"><title>DayMark banner</title>
<!-- Background of the README header (960x560). The app frames are composited into the phone screen
     (left 676, top 30, 232x502, radius 26) by make-gif.py. ?social renders the 1280x640 social preview instead. -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;700&display=swap");
@font-face{font-family:Inter;font-weight:100 900;src:local("Inter"),url(Inter.ttf)} /* Inter.ttf: optional local copy for offline rendering */
*{margin:0;box-sizing:border-box}
html,body{width:960px;height:560px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#0f172a;background:#f8fafc}
body{background:radial-gradient(circle at 12% 18%,rgba(59,130,246,.10),transparent 38%),radial-gradient(circle at 30% 95%,rgba(16,185,129,.12),transparent 40%),radial-gradient(circle at 95% 60%,rgba(236,72,153,.08),transparent 40%),#f8fafc}
#wrap{position:absolute;left:0;top:0;width:960px;height:560px}
.logo{position:absolute;left:58px;top:70px;display:flex;align-items:center;gap:16px}
.logo img{width:62px;height:62px}
.logo h1{font-size:76px;font-weight:300;letter-spacing:-2.5px}
.logo h1 b{font-weight:700}
.tag{position:absolute;left:62px;top:184px;width:560px;font-size:34px;line-height:1.2;font-weight:300;color:#334155}
.tag b{font-weight:600;color:#0f172a}
.sub{position:absolute;left:62px;top:256px;width:540px;font-size:19px;line-height:1.45;color:#64748b}
.pillars{position:absolute;left:62px;top:350px;display:flex;gap:7px;width:590px}
.p{font-size:12px;font-weight:600;letter-spacing:.08em;padding:7px 10px;border-radius:999px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.06);display:flex;align-items:center;gap:7px}
.p i{width:10px;height:10px;border-radius:50%;display:inline-block}
.foot{position:absolute;left:62px;bottom:34px;font-size:15px;font-weight:500;letter-spacing:.14em;color:#94a3b8}
.foot span{color:#3b82f6}
.phone{position:absolute;left:664px;top:18px;width:256px;height:526px;border-radius:38px;background:#0f172a;box-shadow:0 24px 60px rgba(15,23,42,.25),inset 0 0 0 3px #334155}
.screen{position:absolute;left:676px;top:30px;width:232px;height:502px;border-radius:26px;background:#f8fafc}
html.social,html.social body{width:1280px;height:640px}
body.social #wrap{transform:translate(91px,0) scale(1.142857);transform-origin:0 0}
</style></head><body>
<div id="wrap">
<div class="logo"><img src="../../../logo.svg" alt=""><h1>Day<b>Mark</b></h1></div>
<div class="tag">Capacity, <b>not productivity.</b></div>
<div class="sub">A 10-second daily check-in across the five pillars of life. Private: everything stays on your device.</div>
<div class="pillars">
 <span class="p"><i style="background:#10b981"></i>GROWTH</span><span class="p"><i style="background:#3b82f6"></i>LIVELIHOOD</span><span class="p"><i style="background:#ec4899"></i>CONNECTION</span><span class="p"><i style="background:#f59e0b"></i>HEALTH</span><span class="p"><i style="background:#8b5cf6"></i>PURPOSE</span>
</div>
<div class="foot">DINOMIKE.CA/<span>DAYMARK</span></div>
<div class="phone"></div><div class="screen"></div>
</div>
<script>if(location.search.includes("social")){document.documentElement.classList.add("social");document.body.classList.add("social")}</script>
</body></html>
